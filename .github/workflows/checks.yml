name: Verify benchmark tasks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - run: bash run_all_checks.sh --harbor
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-results
          path: check-results/
